- type: entity
  id: BaseDoorElectronics
  parent: BaseElectronics
  components:
    - type: Tag
      tags:
        - DoorElectronics
    - type: AccessReader
    - type: ActivatableUI
      key: enum.DoorElectronicsConfigurationUiKey.Key
      requiredItems:
        tags:
        - DoorElectronicsConfigurator
    - type: UserInterface
      interfaces:
        enum.DoorElectronicsConfigurationUiKey.Key:
          type: DoorElectronicsBoundUserInterface



- type: entity
  id: DoorElectronics
  parent: BaseDoorElectronics
  name: door electronics
  description: An electronics board used in doors and airlocks.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: door_electronics
    - type: DoorElectronics

- type: entity
  id: SecureDoorElectronics
  parent: BaseDoorElectronics
  name: secure door electronics
  description: An electronics board used in secure doors and airlocks.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: security
    - type: SecureDoorElectronics
